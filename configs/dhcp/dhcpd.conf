#
# DHCP Server Configuration file.
#   see /usr/share/doc/dhcp-server/dhcpd.conf.example
#   see dhcpd.conf(5) man page
#

option architecture-type code 93 = unsigned integer 16;

class "PXEClient" {
      match if substring (option vendor-class-identifier, 0, 9) = "PXEClient";
      if option architecture-type = 00:07 or option architecture-type = 00:09 {
      if exists user-class and option user-class = "iPXE" {
      filename "http://192.168.10.1/UEFI/boot.ipxe";}
      else {
      filename "UEFI/ipxe-x86_64.efi";}}
      else {
      filename "BIOS/pxelinux.0";}
}
ignore-client-uids true;
default-lease-time 600;
max-lease-time 1800;
min-lease-time 300;
subnet 192.168.10.0 netmask 255.255.255.0 {
       option routers 192.168.10.1;
       option domain-name-servers 192.168.10.1;
       next-server 192.168.10.1;
       pool {
       allow members of "PXEClient";
       range 192.168.10.50 192.168.10.150;}
       pool {
       deny members of "PXEClient";
       range 192.168.10.2 192.168.10.49;}
}
